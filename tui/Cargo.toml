[package]
name = "crown-tui"
version = "0.1.0"
edition = "2024"
description = "crown-code TUI frontend"

[dependencies]
crown-core = { path = "../core" }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["bracketed-paste", "event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros"] }
interprocess = { version = "2", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tui-textarea = "0.7"
futures-util = "0.3"
unicode-width = "0.1"
pulldown-cmark = "0.10"
textwrap = "0.16"
syntect = "5"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }

[dev-dependencies]
nanoid = "0.4"