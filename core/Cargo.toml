[package]
name = "crown-core"
version = "0.1.0"
edition = "2024"
description = "crown-code core library"

[dependencies]
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"

[target.'cfg(windows)'.dependencies]
which = "6"