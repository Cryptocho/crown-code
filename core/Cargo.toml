[package]
name = "crown-core"
version = "0.1.0"
edition = "2024"
description = "crown-code core library"

[dependencies]
regex = "1"
reqwest = { version = "0.12", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "process"] }
interprocess = { version = "2", features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
which = "6"